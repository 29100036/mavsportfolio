    <!--  COPIED!  -->
      <script>
        // select all elements that have the copy-btn class
        document.querySelectorAll('.copy-btn').forEach(link => {
        // listen for a click event on each copy button
        link.addEventListener('click', (e) => {
            // stop the default link behavior (prevents jumping to the top of the page)
            e.preventDefault();
            
            // read the hidden value stored inside the element's data-copy attribute
            const textToCopy = link.getAttribute('data-copy');
            
            // remember what the link originally said (e.g., "email" or "cellphone")
            const originalText = link.innerText;

            // write the extracted text string straight into the user's system clipboard
            navigator.clipboard.writeText(textToCopy).then(() => {
            // temporarily swap the visible text on the page to "Copied!" for feedback
            link.innerText = 'copied!';
            
            // wait 1500 milliseconds (1.5 seconds) before running the inner function
            setTimeout(() => {
                // revert the link text back to what it originally said
                link.innerText = originalText;
            }, 1500);
            });
        });
        });
    </script>
